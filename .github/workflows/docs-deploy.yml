name: Docs deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: docs
      url: https://www.method-b.uk/pyStrich/docs/

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        # The docs build generates PNG example figures, which need Pillow (the png extra).
        run: uv sync --frozen --no-default-groups --group docs --extra png

      - name: Build docs
        run: |
          uv run --frozen sphinx-build -W --keep-going -b doctest -d docs/_build/.doctrees docs docs/_build/doctest
          uv run --frozen sphinx-build -W --keep-going -b text -d docs/_build/.doctrees docs docs/_build/text
          uv run --frozen sphinx-build -W --keep-going -b html -d docs/_build/.doctrees docs docs/_build/html
          uv run --frozen sphinx-build -W --keep-going -b text -D language=de_DE -d docs/_build/.doctrees-de_DE docs docs/_build/text-de_DE
          uv run --frozen sphinx-build -W --keep-going -b html -D language=de_DE -D html_baseurl=https://www.method-b.uk/pyStrich/docs/de/ -d docs/_build/.doctrees-de_DE docs docs/_build/html/de
          uv run --frozen sphinx-build -W --keep-going -b text -D language=fr_FR -d docs/_build/.doctrees-fr_FR docs docs/_build/text-fr_FR
          uv run --frozen sphinx-build -W --keep-going -b html -D language=fr_FR -D html_baseurl=https://www.method-b.uk/pyStrich/docs/fr/ -d docs/_build/.doctrees-fr_FR docs docs/_build/html/fr

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync docs/_build/html/ "s3://${{ secrets.S3_BUCKET }}/pyStrich/docs/" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/pyStrich/docs/*"