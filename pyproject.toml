[project]
name = "pyStrich"
version = "0.18"
description = "PyStrich is a fast pure-Python module to generate 1D and 2D barcodes: Code 39, Code 128 (including GS1-128), EAN-13, ITF-14, Data Matrix (including GS1 Data Matrix), QR Code, PDF417 and Aztec Code."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Michael Mulqueen", email = "mike@method-b.uk" },
    # Previous authors not listed here. Refer to git log or https://www.method-b.uk/pyStrich/docs/contributors.html
]
maintainers = [
    { name = "Michael Mulqueen", email = "mike@method-b.uk" },
]
keywords = [
    "barcode",
    "qrcode",
    "datamatrix",
    "ean13",
    "code39",
    "code128",
    "interleaved-2-of-5",
    "itf14",
    "pdf417",
    "aztec",
    "gs1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Office/Business",
]
dependencies = [
    # Pillow is needed only for PNG output and is also offered as the ``png``
    # extra. It stays a hard dependency until a future release, when these two
    # lines are removed to make it opt-in.
    "pillow>=10.3; python_version < '3.11'",
    "pillow>=12.2; python_version >= '3.11'",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
# PNG output requires Pillow; SVG, EPS, DXF and terminal output do not.
png = [
    "pillow>=10.3; python_version < '3.11'",
    "pillow>=12.2; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/mmulqueen/pyStrich"
Repository = "https://github.com/mmulqueen/pyStrich"
Documentation = "https://www.method-b.uk/pyStrich/docs/"

[project.scripts]
pystrich = "pystrich.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mypy>=1.13",
    "ezdxf>=1.4.4",
    "fonttools>=4.55",
    "ruff>=0.15.12",
    "zxing-cpp>=2.2",
    "hypothesis>=6.155.2",
    # Tests need Pillow for the png-marked cases; kept here so they still run
    # once Pillow leaves the core dependencies.
    "pillow>=10.3; python_version < '3.11'",
    "pillow>=12.2; python_version >= '3.11'",
    "pre-commit>=4.6.0",
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5",
    "sphinxext-opengraph>=0.13.0",
    "sphinx-sitemap>=2.9.0",
    "sphinx-intl>=2.3.2",
    "polib>=1.2.0",
    "sphinx-argparse-cli>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pystrich"]
exclude = [
    "**/test_*.py",
    "**/conftest.py",
    "**/test_img",
    "pystrich/_simulate_damage.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "pystrich",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    # Generated glyph data.
    "pystrich/_courier_glyphs.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
    "TID251", # flake8-tidy-imports: banned-api
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Pillow is optional: production code must reach it only through pystrich._pillow
# (exempted below) so importing the package never requires Pillow.
"PIL".msg = "Import Pillow via pystrich._pillow so it stays an optional dependency."

[tool.ruff.lint.per-file-ignores]
# Test fixtures contain long expected hex/encoded strings that don't wrap cleanly.
"**/test_*.py" = ["E501"]
# The Pillow gateway and the docs-only damage simulator may import PIL directly.
"pystrich/_pillow.py" = ["TID251"]
"pystrich/_simulate_damage.py" = ["TID251"]

[tool.mypy]
files = ["pystrich"]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
extra_checks = true

# Pillow is an optional dependency, so type-checking must succeed without it.
# When Pillow is installed it ships inline types and is checked fully.
[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "png: needs Pillow for PNG output; runs with the real Pillow instead of the missing-Pillow stub",
]

